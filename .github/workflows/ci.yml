name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME is set) and Gradle fetches the
      # platform it needs, so no separate SDK setup step is required. The setup-android
      # action failed here with "Failed to find package 'tools'".

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The relay server for internet rides: its own tests, no Android needed.
      - name: Relay server tests
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The definition of done includes a release build: R8 and resource shrinking can break
      # things a debug build never shows. Unsigned unless a keystore is provided.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-intercom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
